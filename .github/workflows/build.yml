name: Build AMProjExport.dylib

on:
  push:
    paths:
      - 'AMProjExport/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        working-directory: AMProjExport
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMProjExport.dylib
          path: AMProjExport/AMProjExport.dylib
