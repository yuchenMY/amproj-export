name: Build AMProjExport dylibs

env:
  AMPROJ_RELEASE_VERSION: '43'

on:
  push:
    paths:
      - 'AMProjExport/**'
      - 'debug_backend/**'
      - 'inject_dylib.py'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Windows tooling and debug backend
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest debug_backend.test_server -v

      - name: Build release, cloud, and debug dylibs
        working-directory: AMProjExport
        run: make

      - name: Verify built dylib architectures
        run: |
          python3 - <<'PY'
          import subprocess

          from inject_dylib import verify_dylib_architecture

          required_symbols = {
              "_AMProjCallNativePackageImport",
              "_AMProjInstallNativePackageImportBridge",
          }
          for path in (
              "AMProjExport/AMProjExport.dylib",
              "AMProjExport/AMProjExportCloud.dylib",
              "AMProjExport/AMProjExportDebug.dylib",
          ):
              info = verify_dylib_architecture(path)
              symbols = subprocess.check_output(
                  ["nm", "-gU", path], text=True
              )
              missing = {
                  symbol
                  for symbol in required_symbols
                  if not any(
                      line.rstrip().endswith(" " + symbol)
                      for line in symbols.splitlines()
                  )
              }
              assert not missing, f"{path} missing symbols: {sorted(missing)}"
              print(f"verified {path}: arm64 MH_DYLIB, {info['ncmds']} load commands")
          PY

      - name: Test streaming project archive writer
        run: |
          clang -fobjc-arc -framework Foundation -lz \
            -IAMProjExport AMProjExport/AMProjZIPWriter.m \
            tests/AMProjZIPWriterSmoke.m \
            -o "$RUNNER_TEMP/amproj-writer-smoke"
          "$RUNNER_TEMP/amproj-writer-smoke" \
            "$RUNNER_TEMP/writer-output.amproj" \
            "$RUNNER_TEMP/writer-empty-manifest.amproj"
          python3 - "$RUNNER_TEMP/writer-output.amproj" \
            "$RUNNER_TEMP/writer-empty-manifest.amproj" <<'PY'
          import hashlib
          import re
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              assert names[0] == "resource.bin"
              assert re.fullmatch(r"[0-9a-f-]{36}\.xml", names[1])
              assert names[2] == "manifest.txt"
              assert archive.testzip() is None
              assert archive.read(names[1]).startswith(b"<?xml")
              resource = archive.read("resource.bin")
              assert len(resource) == 200000
              expected = f"{hashlib.sha1(resource).hexdigest().upper()}:resource.bin".encode()
              assert archive.read("manifest.txt") == expected
              assert all(info.date_time == (1980, 1, 1, 0, 0, 0) for info in archive.infolist())

          with zipfile.ZipFile(sys.argv[2]) as archive:
              names = archive.namelist()
              assert len(names) == 2
              assert re.fullmatch(r"[0-9a-f-]{36}\.xml", names[0])
              assert names[1] == "manifest.txt"
              assert archive.testzip() is None
              assert archive.read(names[0]).startswith(b"<?xml")
              assert archive.read("manifest.txt") == b""
          PY

      - name: Write build metadata
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact_paths = (
              Path("AMProjExport/AMProjExport.dylib"),
              Path("AMProjExport/AMProjExportCloud.dylib"),
              Path("AMProjExport/AMProjExportDebug.dylib"),
          )
          metadata = {
              "plugin_version": os.environ["AMPROJ_RELEASE_VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": os.environ["GITHUB_RUN_NUMBER"],
              "sha256": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in artifact_paths
              },
          }
          Path("build-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMProjExport-v${{ env.AMPROJ_RELEASE_VERSION }}-dylibs
          if-no-files-found: error
          retention-days: 14
          path: |
            build-metadata.json
            AMProjExport/AMProjExport.dylib
            AMProjExport/AMProjExportCloud.dylib
            AMProjExport/AMProjExportDebug.dylib
