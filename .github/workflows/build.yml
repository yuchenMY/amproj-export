name: Build AMProjExport dylibs

env:
  AMPROJ_RELEASE_VERSION: '45'

# 自动发布 GitHub Release 需要写 contents 权限
permissions:
  contents: write

on:
  push:
    paths:
      - 'AMProjExport/**'
      - 'AM3D/**'
      - 'AMProjShareExtension/**'
      - 'debug_backend/**'
      - 'inject_dylib.py'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Windows tooling and debug backend
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest debug_backend.test_server -v

      - name: Build release, cloud, and debug dylibs
        working-directory: AMProjExport
        run: make

      - name: Build AM3D dylib (independent 3D empty-object renderer)
        working-directory: AM3D
        run: make

      - name: Test AM3D transform module
        run: |
          clang -fobjc-arc -framework Foundation \
            -IAM3D AM3D/AM3DTransform3D.m \
            tests/AM3DTransform3DSmoke.m \
            -o "$RUNNER_TEMP/am3d-smoke"
          "$RUNNER_TEMP/am3d-smoke"

      - name: Build Share Extension
        run: make -C AMProjShareExtension

      - name: Verify built dylib architectures
        run: |
          python3 - <<'PY'
          import subprocess

          from inject_dylib import verify_dylib_architecture

          required_symbols = {
              "_AMProjCallNativePackageImport",
              "_AMProjInstallNativePackageImportBridge",
          }
          for path in (
              "AMProjExport/AMProjExport.dylib",
              "AMProjExport/AMProjExportCloud.dylib",
              "AMProjExport/AMProjExportDebug.dylib",
          ):
              info = verify_dylib_architecture(path)
              symbols = subprocess.check_output(
                  ["nm", "-gU", path], text=True
              )
              missing = {
                  symbol
                  for symbol in required_symbols
                  if not any(
                      line.rstrip().endswith(" " + symbol)
                      for line in symbols.splitlines()
                  )
              }
              assert not missing, f"{path} missing symbols: {sorted(missing)}"
              print(f"verified {path}: arm64 MH_DYLIB, {info['ncmds']} load commands")

          am3d_info = verify_dylib_architecture("AM3D/AM3D.dylib")
          am3d_symbols = subprocess.check_output(
              ["nm", "-gU", "AM3D/AM3D.dylib"], text=True
          )
          am3d_required = {"_AM3DStart", "_AM3DStop"}
          am3d_missing = {
              symbol
              for symbol in am3d_required
              if not any(
                  line.rstrip().endswith(" " + symbol)
                  for line in am3d_symbols.splitlines()
              )
          }
          assert not am3d_missing, f"AM3D.dylib missing symbols: {sorted(am3d_missing)}"
          print(
              f"verified AM3D/AM3D.dylib: arm64 MH_DYLIB, "
              f"{am3d_info['ncmds']} load commands"
          )
          PY

      - name: Verify Share Extension bundle
        run: |
          python3 - <<'PY'
          from inject_dylib import verify_share_extension_bundle

          path = "AMProjShareExtension/build/AMProjShareExtension.appex"
          info = verify_share_extension_bundle(
              path,
              "com.amayaka.meow.amprojshare",
              "group.com.amayaka.meow.amprojshare",
          )
          print(
              f"verified {path}: {info['bundle_identifier']}, "
              f"{info['app_group_id']}, arm64 MH_EXECUTE/share-services"
          )
          PY

      - name: Test 3D transform module (empty-object 3D parent controller math)
        run: |
          clang -fobjc-arc -framework Foundation \
            -IAMProjExport AMProjExport/AMProjTransform3D.m \
            tests/AMProjTransform3DSmoke.m \
            -o "$RUNNER_TEMP/amproj-3d-smoke"
          "$RUNNER_TEMP/amproj-3d-smoke"

      - name: Test streaming project archive writer
        run: |
          clang -fobjc-arc -framework Foundation -lz \
            -IAMProjExport AMProjExport/AMProjZIPWriter.m \
            tests/AMProjZIPWriterSmoke.m \
            -o "$RUNNER_TEMP/amproj-writer-smoke"
          "$RUNNER_TEMP/amproj-writer-smoke" \
            "$RUNNER_TEMP/writer-output.amproj" \
            "$RUNNER_TEMP/writer-empty-manifest.amproj"
          python3 - "$RUNNER_TEMP/writer-output.amproj" \
            "$RUNNER_TEMP/writer-empty-manifest.amproj" <<'PY'
          import hashlib
          import re
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              assert names[0] == "resource.bin"
              assert re.fullmatch(r"[0-9a-f-]{36}\.xml", names[1])
              assert names[2] == "manifest.txt"
              assert archive.testzip() is None
              assert archive.read(names[1]).startswith(b"<?xml")
              resource = archive.read("resource.bin")
              assert len(resource) == 200000
              expected = f"{hashlib.sha1(resource).hexdigest().upper()}:resource.bin".encode()
              assert archive.read("manifest.txt") == expected
              assert all(info.date_time == (1980, 1, 1, 0, 0, 0) for info in archive.infolist())

          with zipfile.ZipFile(sys.argv[2]) as archive:
              names = archive.namelist()
              assert len(names) == 2
              assert re.fullmatch(r"[0-9a-f-]{36}\.xml", names[0])
              assert names[1] == "manifest.txt"
              assert archive.testzip() is None
              assert archive.read(names[0]).startswith(b"<?xml")
              assert archive.read("manifest.txt") == b""
          PY

      - name: Write build metadata
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact_paths = (
              Path("AMProjExport/AMProjExport.dylib"),
              Path("AMProjExport/AMProjExportCloud.dylib"),
              Path("AMProjExport/AMProjExportDebug.dylib"),
              Path("AMProjShareExtension/build/AMProjShareExtension.appex/AMProjShareExtension"),
              Path("AMProjShareExtension/build/AMProjShareExtension.appex/Info.plist"),
              Path("AMProjShareExtension/build/AMProjShareExtension.entitlements"),
          )
          metadata = {
              "plugin_version": os.environ["AMPROJ_RELEASE_VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": os.environ["GITHUB_RUN_NUMBER"],
              "sha256": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in artifact_paths
              },
          }
          Path("build-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMProjExport-v${{ env.AMPROJ_RELEASE_VERSION }}-dylibs
          if-no-files-found: error
          retention-days: 14
          path: |
            build-metadata.json
            AMProjExport/AMProjExport.dylib
            AMProjExport/AMProjExportCloud.dylib
            AMProjExport/AMProjExportDebug.dylib
            AM3D/AM3D.dylib
            AMProjShareExtension/build/AMProjShareExtension.appex
            AMProjShareExtension/build/AMProjShareExtension.entitlements

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${AMPROJ_RELEASE_VERSION}"
          SHA12="${GITHUB_SHA:0:12}"
          TAG="amproj-v${VER}-${SHA12}"
          STAGE="$RUNNER_TEMP/release-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp AMProjExport/AMProjExport.dylib "$STAGE/"
          cp AMProjExport/AMProjExportCloud.dylib "$STAGE/"
          cp AMProjExport/AMProjExportDebug.dylib "$STAGE/"
          cp build-metadata.json "$STAGE/"
          (cd "$STAGE" && zip -q "AMProjExport-v${VER}-dylibs.zip" \
            AMProjExport.dylib AMProjExportCloud.dylib AMProjExportDebug.dylib \
            build-metadata.json)
          NOTES=$(cat <<'EOF'
                    AMProjExport v45（空对象 3D 父级控制器导出扩展）

                    - AMProjTransform3D：崩溃安全 3D 数学（欧拉 XYZ / TRS 合成 / 逆矩阵 / NaN-Inf-除零防御）
                    - 场景 XML 导出 3D 数据：图层级 property meow3d.rotation / meow3d.scale / meow3d.enabled
                    - 与 3D_Body_Test_20260826/empty3d 的 Python 模型同一套数据约定
                    - 旧项目格式完全兼容：无 3D 数据时输出与旧版逐字节一致
                    - 3D 数学单元冒烟（tests/AMProjTransform3DSmoke.m）随构建运行

                    注入命令（Windows，见仓库 README）：
                      python inject_dylib.py <输入.ipa> AMProjExportCloud.dylib <输出.ipa> \
                        --expected-main-uuid <主程序UUID>
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[*] Release $TAG already exists; uploading assets"
            gh release upload "$TAG" "$STAGE/AMProjExport-v${VER}-dylibs.zip" --clobber
          else
            echo "[+] Creating release $TAG"
            gh release create "$TAG" "$STAGE/AMProjExport-v${VER}-dylibs.zip" \
              --title "AMProjExport v${VER} (3D empty-object export)" \
              --notes "$NOTES"
          fi

      - name: Create AM3D Release (independent 3D renderer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA12="${GITHUB_SHA:0:12}"
          TAG="am3d-v1-${SHA12}"
          STAGE="$RUNNER_TEMP/am3d-release-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp AM3D/AM3D.dylib "$STAGE/"
          python3 - "$STAGE/am3d-metadata.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          dylib = Path("AM3D/AM3D.dylib")
          metadata = {
              "plugin_version": "am3d-v1",
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "sha256": {
                  "AM3D/AM3D.dylib": hashlib.sha256(dylib.read_bytes()).hexdigest()
              },
          }
          Path(sys.argv[1]).write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (cd "$STAGE" && zip -q "AM3D-v1.dylib.zip" AM3D.dylib am3d-metadata.json)
          NOTES=$(cat <<'EOF'
          AM3D v1 — 独立 3D 空对象渲染桥（真 3D 优先）

          - 完全独立的注入 dylib，不依赖也不修改 AMProjExport / AmHomeUI
          - CADisplayLink 每帧：探测项目 sceneInfo（ProjectHolder->rootScene->layers）
            与画布，按 z-order 配对图层；空对象父链 world 矩阵（欧拉 XYZ + TRS）
            写入子层 CALayer transform；画布 sublayerTransform 加透视 m34
          - 降级：映射不到真实图层时叠加半透明占位演示（AM3DDemoFallback）
          - 配置（UserDefaults）：AM3DEnabled / AM3DLog / AM3DPerspective / AM3DDemoFallback
          - 崩溃安全：全程 @try/@catch，父链深度 64 保护，脏检查避免无谓写入

          注入命令（追加到已有 IPA，不替换其他 dylib）：
            python inject_dylib.py <输入.ipa> AM3D.dylib <输出.ipa> \
              --expected-main-uuid <主程序UUID>
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[*] Release $TAG already exists; uploading assets"
            gh release upload "$TAG" "$STAGE/AM3D-v1.dylib.zip" --clobber
          else
            echo "[+] Creating release $TAG"
            gh release create "$TAG" "$STAGE/AM3D-v1.dylib.zip" \
              --title "AM3D v1 (3D empty-object renderer)" \
              --notes "$NOTES"
          fi
