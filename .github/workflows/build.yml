name: Build AMProjExport dylibs

on:
  push:
    paths:
      - 'AMProjExport/**'
      - 'AMProjShareExtension/**'
      - 'debug_backend/**'
      - 'inject_dylib.py'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Windows tooling and debug backend
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest debug_backend.test_server -v

      - name: Build release and debug dylibs
        working-directory: AMProjExport
        run: make

      - name: Build Share Extension
        run: make -C AMProjShareExtension

      - name: Verify built dylib architectures
        run: |
          python3 - <<'PY'
          from inject_dylib import verify_dylib_architecture

          for path in (
              "AMProjExport/AMProjExport.dylib",
              "AMProjExport/AMProjExportDebug.dylib",
          ):
              info = verify_dylib_architecture(path)
              print(f"verified {path}: arm64 MH_DYLIB, {info['ncmds']} load commands")
          PY

      - name: Verify Share Extension bundle
        run: |
          python3 - <<'PY'
          from inject_dylib import verify_share_extension_bundle

          path = "AMProjShareExtension/build/AMProjShareExtension.appex"
          info = verify_share_extension_bundle(
              path,
              "com.alightmotion.meow.amprojshare",
              "group.com.alightmotion.meow.amprojshare",
          )
          print(
              f"verified {path}: {info['bundle_identifier']}, "
              f"{info['app_group_id']}, arm64 MH_EXECUTE/share-services"
          )
          PY

      - name: Test streaming project archive writer
        run: |
          clang -fobjc-arc -framework Foundation -lz \
            -IAMProjExport AMProjExport/AMProjZIPWriter.m \
            tests/AMProjZIPWriterSmoke.m \
            -o "$RUNNER_TEMP/amproj-writer-smoke"
          "$RUNNER_TEMP/amproj-writer-smoke" "$RUNNER_TEMP/writer-output.amproj"
          python3 - "$RUNNER_TEMP/writer-output.amproj" <<'PY'
          import hashlib
          import re
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              assert names[0] == "resource.bin"
              assert re.fullmatch(r"[0-9a-f-]{36}\.xml", names[1])
              assert names[2] == "manifest.txt"
              assert archive.testzip() is None
              assert archive.read(names[1]).startswith(b"<?xml")
              resource = archive.read("resource.bin")
              assert len(resource) == 200000
              expected = f"{hashlib.sha1(resource).hexdigest().upper()}:resource.bin".encode()
              assert archive.read("manifest.txt") == expected
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMProjExport-dylibs
          path: |
            AMProjExport/AMProjExport.dylib
            AMProjExport/AMProjExportDebug.dylib
            AMProjShareExtension/build/AMProjShareExtension.appex
            AMProjShareExtension/build/AMProjShareExtension.entitlements
