name: Build iOS Dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile libWebHome.dylib (full version)
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=12.0 \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            -install_name @executable_path/Frameworks/libWebHome.dylib \
            -o libWebHome.dylib \
            WebHome.m
          ls -la libWebHome.dylib

      - name: Compile AhmadDev.dylib (login bypass + Oracle redirect)
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=12.0 \
            -framework Foundation \
            -install_name @executable_path/Frameworks/AhmadDev.dylib \
            -o AhmadDev.dylib \
            AhmadDev.m
          ls -la AhmadDev.dylib

      - name: Compile MeowRotate3D.dylib (recon for 3D-rotate mod)
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=12.0 \
            -framework UIKit \
            -framework Foundation \
            -install_name @executable_path/Frameworks/MeowRotate3D.dylib \
            -o MeowRotate3D.dylib \
            MeowRotate3D.m
          ls -la MeowRotate3D.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-dylibs
          path: |
            libWebHome.dylib
            AhmadDev.dylib
            MeowRotate3D.dylib
